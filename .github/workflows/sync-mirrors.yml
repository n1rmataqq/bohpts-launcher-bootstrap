name: Sync mirror list

# Pulls the signed mirror list from a distribution mirror and commits it here, so the launcher has
# a second place to find it when every mirror is blocked.
#
# Pull, not push, on purpose: nothing on our side needs a GitHub credential, and the built-in
# GITHUB_TOKEN never leaves the runner. Integrity does not depend on this repository — the launcher
# verifies the Ed25519 signature inside the file and rejects anything that fails.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-mirrors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate
        id: fetch
        run: |
          set -euo pipefail

          # Sources come from the list already committed here, not from a hardcoded host: when the
          # fleet moved to its own domain the pinned provider name kept resolving but stopped
          # matching the certificate, and this channel sat frozen while both other channels moved.
          # Reading the document we already carry means a fleet change cannot outrun this workflow.
          mapfile -t SRCS < <(python3 -c '
          import base64, json, pathlib
          doc = json.loads(pathlib.Path("bohpts/mirrors.json").read_text())
          for m in json.loads(base64.b64decode(doc["payload_b64"]))["mirrors"]:
              if m.get("enabled"):
                  print(m["base_url"].rstrip("/") + "/config/mirrors.json")
          ')
          test "${#SRCS[@]}" -gt 0

          # The mirror caps concurrent connections per IP and answers 429 with an HTML body while
          # players are downloading. Retry, and never let that page reach the repository.
          for attempt in 1 2 3 4 5; do
            for src in "${SRCS[@]}"; do
              if curl -fsS --max-time 20 -o candidate.json "$src"; then break 2; fi
            done
            sleep $((attempt * 10))
          done
          test -s candidate.json

          python3 - <<'PY'
          import base64, json, sys, pathlib
          new = json.loads(pathlib.Path("candidate.json").read_text())
          for field in ("payload_b64", "sig", "key_id"):
              if field not in new:
                  sys.exit(f"not a signed envelope: {field} missing")
          serial = json.loads(base64.b64decode(new["payload_b64"]))["serial"]

          current = pathlib.Path("bohpts/mirrors.json")
          if current.exists():
              old = json.loads(current.read_text())
              old_serial = json.loads(base64.b64decode(old["payload_b64"]))["serial"]
              # A bootstrap channel that can move backwards is a rollback vector: the launcher
              # would see an older-but-validly-signed list. Refuse rather than commit.
              if serial < old_serial:
                  sys.exit(f"refusing to go backwards: {serial} < {old_serial}")
          print(f"serial={serial}")
          PY

          mv candidate.json bohpts/mirrors.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- bohpts/mirrors.json; then
            echo "unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bohpts/mirrors.json
          git commit -m "chore: sync signed mirror list"
          git push
